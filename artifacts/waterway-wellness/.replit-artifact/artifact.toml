kind = "web"
previewPath = "/"
title = "Waterway Wellness"
version = "1.0.0"
id = "artifacts/waterway-wellness"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25544

[services.development]
run = "pnpm --filter @workspace/waterway-wellness run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/waterway-wellness", "run", "build" ]
publicDir = "artifacts/waterway-wellness/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25544"
BASE_PATH = "/"
