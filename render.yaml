services:
  - type: web
    name: waterwaywellness-api
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@11.5.0 --activate && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/api-server build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: PRINTIFY_API_TOKEN
        sync: false
      - key: PORT
        value: 10000
