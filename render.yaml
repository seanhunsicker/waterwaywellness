services:
  - type: web
    name: waterwaywellness-api
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile --ignore-scripts && pnpm rebuild esbuild && pnpm --filter @workspace/api-server build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: PRINTIFY_API_TOKEN
        sync: false
      - key: PORT
        value: 10000
